# Serrado FC — produção numa VPS (ver docs/DEPLOY-VPS.md).
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Só o Caddy (serviço «web») fica exposto, nas portas 80 e 443. Serve o site e encaminha
# /api/* para o middleware. Como site e API ficam no mesmo endereço, o cookie de sessão
# é first-party e funciona em todos os browsers. Backend e PostgreSQL ficam só na rede interna.
name: serrado

x-env: &env
  NODE_ENV: production
  DATABASE_URL: postgres://serrado:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD no .env}@db:5432/serrado
  SERVICE_TOKEN: ${SERVICE_TOKEN:?falta SERVICE_TOKEN no .env}
  JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET no .env}

x-services: &services
  build: ../services
  image: serrado/services:latest
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: serrado
      POSTGRES_USER: serrado
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U serrado -d serrado']
      interval: 5s
      retries: 20
    logging: *logging

  # Aplica as migrações em cada deploy. Nunca carrega o seed de demonstração.
  migrate:
    <<: *services
    restart: 'no'
    command: ['node', 'db/migrate.ts']
    environment: *env
    depends_on:
      db: { condition: service_healthy }

  backend:
    <<: *services
    command: ['node', 'backend/src/server.ts']
    environment: *env
    expose: ['4100']
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4100/internal/health || exit 1']
      interval: 10s
      retries: 10

  middleware:
    <<: *services
    command: ['node', 'middleware/src/server.ts']
    environment:
      <<: *env
      BACKEND_URL: http://backend:4100
      CORS_ORIGINS: https://${SITE_DOMAIN:?falta SITE_DOMAIN no .env}
    expose: ['4000']
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/health || exit 1']
      interval: 10s
      retries: 10

  # Site (Angular, modo API) + HTTPS automático (Let's Encrypt) + proxy para a API
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        SITE_URL: https://${SITE_DOMAIN}
    image: serrado/web:latest
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      middleware: { condition: service_healthy }
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
