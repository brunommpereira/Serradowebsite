[project]
name = "serrado-services"
version = "1.0.0"
description = "Middleware (API pública /api/v1) e backend (API interna /internal/v1) do Serrado FC Digital"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "psycopg[binary]==3.3.6",
  "psycopg-pool==3.3.3",
  "httpx==0.28.1",
  "nh3==0.3.7",
  "pyjwt[crypto]==2.15.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "mypy==2.3.1",
  "ruff==0.16.9",
]

[tool.uv]
package = false
# Só versões publicadas há pelo menos uma semana (reprodutível e sem versões acabadas de sair)
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "S608", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
packages = ["serrado"]
ignore_missing_imports = true
check_untyped_defs = true
