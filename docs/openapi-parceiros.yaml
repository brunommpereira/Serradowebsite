openapi: 3.1.0
info:
  title: Serrado FC — API de parceiros (pedidos de gasto)
  version: 1.0.0
  summary: Registo de pedidos de gasto por sistemas externos e consulta do estado do processo.
  description: |
    API para sistemas externos (ERP, plataforma de compras, outra aplicação) registarem **pedidos de gasto** no
    Serrado FC e acompanharem o **estado** do processo de aprovação e pagamento.

    **Autenticação:** OAuth 2.0 *client credentials*.
    1. Peça um token em `POST /oauth/token`, com o `client_id` e o `client_secret` (HTTP Basic, formulário ou JSON).
    2. Envie o token em `Authorization: Bearer <access_token>`. O token vale 15 minutos.

    **Credenciais:** são criadas no backoffice do clube (Gestão → API de parceiros). O segredo só é mostrado uma
    vez; o clube guarda apenas o hash. Cada cliente faz os pedidos em nome de uma conta responsável e só nos núcleos
    que lhe foram permitidos.

    **Fluxo:** um pedido registado entra no fluxo normal de aprovação do clube. A sequência depende do núcleo:

    `pedido` → `aprovado_nucleo` → `aprovado` → `pago`

    O pedido pode terminar `rejeitado` ou `anulado` em qualquer passo antes do pagamento.

    **Idempotência:** envie sempre `externalRef` (a referência no vosso sistema). Repetir um pedido com a mesma
    referência devolve o pedido já existente, com `duplicate: true`, em vez de criar outro.

    **Uso:** só entre servidores. Não chame esta API a partir de um browser: o segredo nunca pode estar em código que
    corre no cliente.

    **Limites por IP e por minuto:**
    - 10 pedidos de token;
    - 30 registos de pedidos;
    - 120 consultas.

    Acima disso, a resposta é `429`.
  contact:
    name: Serrado FC
    url: https://www.serradofc.pt/contactos
servers:
  - url: https://www.serradofc.pt/api/v1/partner
    description: Produção
tags:
  - name: Autenticação
    description: Token de acesso (OAuth 2.0 client credentials)
  - name: Pedidos de gasto
    description: Registo e consulta do estado

paths:
  /oauth/token:
    post:
      tags: [Autenticação]
      operationId: getToken
      summary: Obter um token de acesso
      description: |
        Troca o `client_id` e o `client_secret` por um token de acesso de 15 minutos.

        As credenciais podem ir:
        - em **HTTP Basic** (`Authorization: Basic base64(client_id:client_secret)`), que é o recomendado;
        - no corpo, como formulário (`application/x-www-form-urlencoded`) ou JSON.

        O `client_id` inexistente e o segredo errado dão a mesma resposta (`invalid_client`).
      security:
        - clientBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/TokenRequest' }
            examples:
              basic:
                summary: Com HTTP Basic (só o grant_type no corpo)
                value: { grant_type: client_credentials }
              body:
                summary: Credenciais no corpo
                value: { grant_type: client_credentials, client_id: sfc_cli_85537f96cdd4d6f6, client_secret: sfc_sk_… }
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Token emitido
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
              example: { access_token: sfc_at_…, token_type: Bearer, expires_in: 900 }
        '400':
          description: Pedido mal formado (`invalid_request`) ou `grant_type` diferente de `client_credentials` (`unsupported_grant_type`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
              example: { error: unsupported_grant_type, error_description: 'Use grant_type=client_credentials', message: 'Use grant_type=client_credentials' }
        '401':
          description: Credenciais erradas, ou cliente revogado
          headers:
            WWW-Authenticate:
              schema: { type: string, example: 'Basic realm="serrado-fc"' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
              example: { error: invalid_client, error_description: Credenciais do cliente inválidas, message: Credenciais do cliente inválidas }
        '429': { $ref: '#/components/responses/RateLimited' }

  /expenses:
    post:
      tags: [Pedidos de gasto]
      operationId: createExpense
      summary: Registar um pedido de gasto
      description: |
        Regista o pedido e devolve o **`id`**, que serve para consultar o estado, e o número interno (`number`).

        - O pedido fica em nome da conta responsável do cliente e entra no fluxo de aprovação do núcleo.
        - Os tesoureiros recebem o aviso por email, como num pedido feito no backoffice.
        - Com `externalRef`, um reenvio devolve o pedido existente com `duplicate: true` (também com HTTP 201).
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseRequest' }
            example:
              externalRef: ERP-2026-0042
              nucleo: rugby
              category: Deslocações e transportes
              title: Autocarro para o jogo em Coimbra
              purpose: Deslocação da equipa sénior, 14/12
              supplier: Transportes Lda
              supplierNif: '509999990'
              amount: '350.00'
              dueDate: '2026-12-15'
              paymentInfo: PT50 0000 0000 0000 0000 0000 0
              files: [{ name: orcamento.pdf, data: JVBERi0xLjQK… }]
      responses:
        '201':
          description: 'Pedido registado (ou já existente, com `duplicate: true`)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseCreated' }
              example:
                id: 1
                number: 2026/001
                externalRef: ERP-2026-0042
                status: pedido
                statusLabel: Aguarda aprovação do tesoureiro do núcleo
                final: false
                flow: nucleo_direcao
                flowLabel: Tesoureiro do núcleo e depois tesouraria da direção
                nucleo: rugby
                category: Deslocações e transportes
                title: Autocarro para o jogo em Coimbra
                supplier: Transportes Lda
                amount: 350.0
                approvedAmount: null
                requestedAt: '2026-11-10T19:18:47.005Z'
                updatedAt: '2026-11-10T19:18:47.005Z'
                rejectReason: null
                payment: null
                invoiceReceived: false
                history: [{ at: '2026-11-10T19:18:47.005Z', action: pedido, label: Pedido registado }]
                duplicate: false
        '400':
          description: Dados inválidos (`validation`), data limite no passado (`invalid_due_date`) ou anexo inválido (`invalid_file`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: validation, message: 'amount: Input should be greater than 0' }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '403':
          description: Núcleo fora dos permitidos ao cliente (`nucleo_not_allowed`), ou a conta responsável deixou de poder pedir gastos (`client_user_not_allowed`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: nucleo_not_allowed, message: Este cliente não pode fazer pedidos para o núcleo «futsal» }
        '413':
          description: Anexo com mais de 10 MB (`file_too_large`) ou corpo grande demais
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Tipo de anexo não aceite (`unsupported_file`); só PDF, JPG, PNG ou WebP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Pedidos de gasto]
      operationId: findExpenseByRef
      summary: Procurar um pedido pela referência externa
      description: Devolve o pedido feito por este cliente com a referência dada.
      security:
        - bearerToken: []
      parameters:
        - name: externalRef
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ExternalRef' }
      responses:
        '200':
          description: Estado do pedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseStatus' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /expenses/{id}:
    get:
      tags: [Pedidos de gasto]
      operationId: getExpenseStatus
      summary: Consultar o estado de um pedido
      description: |
        Estado atual, valor aprovado, pagamento, motivo de rejeição e histórico. O histórico não inclui nomes nem
        notas internas.

        Só se veem os pedidos feitos pelo próprio cliente: qualquer outro `id` devolve `404`.

        Consulte com intervalos razoáveis, por exemplo de hora a hora, até `final` ser `true`.
      security:
        - bearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          example: 1
      responses:
        '200':
          description: Estado do pedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseStatus' }
              example:
                id: 1
                number: 2026/001
                externalRef: ERP-2026-0042
                status: pago
                statusLabel: Pago
                final: true
                flow: nucleo_direcao
                flowLabel: Tesoureiro do núcleo e depois tesouraria da direção
                nucleo: rugby
                category: Deslocações e transportes
                title: Autocarro para o jogo em Coimbra
                supplier: Transportes Lda
                amount: 350.0
                approvedAmount: 320.0
                requestedAt: '2026-11-10T19:18:47.005Z'
                updatedAt: '2026-11-13T10:12:00.000Z'
                rejectReason: null
                payment: { paidOn: '2026-11-13', amount: 320.0, method: transferencia }
                invoiceReceived: false
                history:
                  - { at: '2026-11-10T19:18:47.005Z', action: pedido, label: Pedido registado }
                  - { at: '2026-11-11T09:02:10.120Z', action: aprovado_nucleo, label: Aprovado pelo tesoureiro do núcleo }
                  - { at: '2026-11-13T10:12:00.000Z', action: aprovado, label: Aprovado pela tesouraria da direção }
                  - { at: '2026-11-13T10:12:00.000Z', action: pago, label: Pago }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/InvalidToken' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 client credentials (o token vale 15 minutos)
      flows:
        clientCredentials:
          tokenUrl: https://www.serradofc.pt/api/v1/partner/oauth/token
          scopes: {}
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: opaque (sfc_at_…)
      description: Token obtido em `POST /oauth/token`
    clientBasic:
      type: http
      scheme: basic
      description: '`client_id` como utilizador e `client_secret` como password (só para `POST /oauth/token`)'

  responses:
    InvalidToken:
      description: Sem token, token inválido ou expirado (`invalid_token`). Peça um novo token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: invalid_token, message: Token de acesso inválido ou expirado }
    NotFound:
      description: Pedido inexistente ou feito por outro cliente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: not_found, message: Pedido não encontrado }
    Validation:
      description: Parâmetro inválido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Demasiados pedidos; aguarde um minuto
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: rate_limited, message: Demasiadas tentativas. Tenta novamente daqui a pouco. }

  schemas:
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type: { type: string, const: client_credentials }
        client_id: { type: string, maxLength: 40, description: 'Obrigatório se não usar HTTP Basic', example: sfc_cli_85537f96cdd4d6f6 }
        client_secret: { type: string, maxLength: 100, description: 'Obrigatório se não usar HTTP Basic', format: password }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string, description: 'Token opaco, começa por `sfc_at_`' }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Validade em segundos, example: 900 }
    OAuthError:
      type: object
      required: [error, error_description]
      properties:
        error: { type: string, enum: [invalid_request, unsupported_grant_type, invalid_client] }
        error_description: { type: string }
        message: { type: string, description: 'Igual a error_description (formato do resto da API)' }
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Código estável, para tratar no vosso sistema
          examples: [validation, invalid_token, nucleo_not_allowed, client_user_not_allowed, not_found, invalid_due_date, invalid_file, file_too_large, unsupported_file, rate_limited]
        message: { type: string, description: 'Explicação em português, para pessoas' }

    ExternalRef:
      type: string
      pattern: '^[A-Za-z0-9._:/-]{1,64}$'
      description: Referência do pedido no vosso sistema (única por cliente)
      example: ERP-2026-0042
    Nucleo:
      type: string
      enum: [direcao, atletismo, futsal, rugby]
      description: |
        Centro de custo:
        - `direcao` — Direção (geral);
        - `atletismo`, `futsal`, `rugby` — as modalidades.

        Só os núcleos permitidos ao cliente.
    Category:
      type: string
      enum:
        - Material e equipamentos
        - Deslocações e transportes
        - Inscrições, taxas e filiações
        - Arbitragem
        - Alimentação
        - Instalações e manutenção
        - Saúde e seguros
        - Comunicação e marketing
        - Serviços e honorários
        - Outros
    Status:
      type: string
      enum: [pedido, aprovado_nucleo, aprovado, pago, rejeitado, anulado]
      description: |
        - `pedido`: aguarda aprovação do tesoureiro do núcleo;
        - `aprovado_nucleo`: aguarda aprovação da tesouraria da direção;
        - `aprovado`: aprovado, aguarda pagamento;
        - `pago`: pago (estado final);
        - `rejeitado`: rejeitado (estado final, ver `rejectReason`);
        - `anulado`: anulado (estado final).
    Flow:
      type: string
      enum: [nucleo_direcao, so_nucleo, so_direcao]
      description: |
        Fluxo de aprovação do núcleo, fixado quando o pedido é criado:
        - `nucleo_direcao`: tesoureiro do núcleo e depois tesouraria da direção;
        - `so_nucleo`: só o tesoureiro do núcleo (a tesouraria paga);
        - `so_direcao`: só a tesouraria da direção.
    Money:
      description: Valor em euros com IVA, com até 2 casas decimais. Envie como texto para não perder precisão.
      oneOf:
        - { type: string, pattern: '^\d{1,6}(\.\d{1,2})?$', example: '350.00' }
        - { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1000000 }
    File:
      type: object
      required: [name, data]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200, example: orcamento.pdf }
        data:
          type: string
          contentEncoding: base64
          description: Conteúdo em base64 (PDF, JPG, PNG ou WebP; até 10 MB). O tipo é validado pelo conteúdo, não pelo nome.

    ExpenseRequest:
      type: object
      additionalProperties: false
      required: [nucleo, category, title, supplier, amount]
      properties:
        externalRef: { $ref: '#/components/schemas/ExternalRef' }
        nucleo: { $ref: '#/components/schemas/Nucleo' }
        category: { $ref: '#/components/schemas/Category' }
        title: { type: string, minLength: 3, maxLength: 120, description: Descrição curta do gasto }
        purpose: { type: string, maxLength: 2000, default: '', description: 'Finalidade / detalhe' }
        supplier: { type: string, minLength: 2, maxLength: 160, description: Fornecedor }
        supplierNif: { type: [string, 'null'], pattern: '^\s*(\d\s*){9}$', description: 'NIF do fornecedor: 9 algarismos (os espaços são ignorados)', example: '509999990' }
        amount: { $ref: '#/components/schemas/Money' }
        dueDate: { type: [string, 'null'], format: date, description: 'Data limite de pagamento (hoje ou depois)' }
        paymentInfo: { type: string, maxLength: 300, default: '', description: 'IBAN, referência MB, etc.' }
        files:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/File' }
          description: Fatura ou orçamento (opcional)

    HistoryItem:
      type: object
      required: [at, action, label]
      properties:
        at: { type: string, format: date-time }
        action:
          type: string
          examples: [pedido, aprovado_nucleo, rejeitado_nucleo, aprovado, rejeitado, pago, anulado, anexo, fatura_recebida, fatura_em_falta]
        label: { type: string, example: Aprovado pelo tesoureiro do núcleo }
    Payment:
      type: object
      required: [paidOn, amount, method]
      properties:
        paidOn: { type: string, format: date }
        amount: { type: number }
        method: { type: string, enum: [transferencia, numerario, cartao, mbway, cheque, debito] }

    ExpenseStatus:
      type: object
      required: [id, number, status, statusLabel, final, flow, nucleo, title, amount, requestedAt, updatedAt, history]
      properties:
        id: { type: integer, description: 'Identificador do pedido (usar em GET /expenses/{id})' }
        number: { type: string, description: 'N.º interno do pedido no ano (AAAA/NNN)', example: 2026/001 }
        externalRef: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/Status' }
        statusLabel: { type: string, description: 'O estado em texto, para mostrar a pessoas' }
        final: { type: boolean, description: 'true quando o processo terminou (pago, rejeitado ou anulado)' }
        flow: { $ref: '#/components/schemas/Flow' }
        flowLabel: { type: string }
        nucleo: { $ref: '#/components/schemas/Nucleo' }
        category: { $ref: '#/components/schemas/Category' }
        title: { type: string }
        supplier: { type: string }
        amount: { type: number, description: Valor pedido }
        approvedAmount: { type: [number, 'null'], description: 'Valor aprovado pelo tesoureiro do núcleo (pode ser menor)' }
        requestedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        rejectReason: { type: [string, 'null'], description: 'Motivo, quando rejeitado' }
        payment:
          oneOf:
            - { $ref: '#/components/schemas/Payment' }
            - { type: 'null' }
          description: Dados do pagamento, quando pago
        invoiceReceived: { type: boolean, description: O clube já recebeu a fatura-recibo final }
        history: { type: array, items: { $ref: '#/components/schemas/HistoryItem' } }
    ExpenseCreated:
      allOf:
        - { $ref: '#/components/schemas/ExpenseStatus' }
        - type: object
          required: [duplicate]
          properties:
            duplicate: { type: boolean, description: 'true se já existia um pedido com o mesmo externalRef (não foi criado outro)' }
