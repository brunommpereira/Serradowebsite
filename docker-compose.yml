# Serrado FC Digital — base de dados + backend (privado) + middleware (público).
# Desenvolvimento:  docker compose up --build   →  API em http://localhost:4000/api/docs
# Produção: definir SERVICE_TOKEN, JWT_SECRET, POSTGRES_PASSWORD e CORS_ORIGINS num .env
# (e APP_ENV=production), não carregar o seed de demonstração e pôr o middleware atrás de HTTPS.
name: serrado

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: serrado
      POSTGRES_USER: serrado
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serrado}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U serrado -d serrado']
      interval: 3s
      retries: 20
    # Sem «ports»: a base de dados só é acessível na rede interna do compose
    # (para aceder de fora em desenvolvimento: docker compose -f docker-compose.yml -f docker-compose.dev.yml up)

  migrate:
    build: ./services
    command: ['sh', '-c', 'python -m serrado.db.migrate && if [ "$$DEMO_SEED" = "1" ]; then python -m serrado.db.seed; fi']
    environment: &env
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://serrado:${POSTGRES_PASSWORD:-serrado}@db:5432/serrado
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-please-32chars}
      DEMO_SEED: ${DEMO_SEED:-1}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./services
    command: ['python', '-m', 'serrado.backend.server']
    environment: *env
    # Só na rede interna: nunca publicar a porta 4100
    expose: ['4100']
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:4100/internal/health")']
      interval: 5s
      retries: 10

  middleware:
    build: ./services
    command: ['python', '-m', 'serrado.middleware.server']
    environment:
      <<: *env
      BACKEND_URL: http://backend:4100
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,https://brunommpereira.github.io}
    ports: ['4000:4000']
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
