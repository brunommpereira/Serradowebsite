name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/serrado-fc/browser

  services:
    name: Middleware + backend (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: serrado
          POSTGRES_PASSWORD: serrado
          POSTGRES_DB: serrado
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U serrado" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: services
    env:
      TEST_DATABASE_URL: postgresql://serrado:serrado@localhost:5432/serrado_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: services/uv.lock
      - run: uv sync --frozen
      - name: Estilo (ruff)
        run: uv run ruff check serrado tests && uv run ruff format --check serrado tests
      - name: Tipos (mypy)
        run: uv run mypy
      - name: Testes (pytest, PostgreSQL real)
        run: uv run pytest -q
